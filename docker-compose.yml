services:
  # Web Frontend (Vite + React Nginx Server)
  # Public Host Port: 3000 (UI)
  # Internal IP: 172.28.0.10
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lan-guessr-frontend
    networks:
      languessr_net:
        ipv4_address: 172.28.0.10
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  # API Gateway & Reverse Proxy Microservice (NestJS)
  # Public Host Port: 5000 (Ingress API & WebSocket Proxy)
  # Internal IP: 172.28.0.20
  api-gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: lan-guessr-gateway
    networks:
      languessr_net:
        ipv4_address: 172.28.0.20
        aliases:
          - backend
          - gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HOST_PRIMARY_IP: ${HOST_PRIMARY_IP:-192.168.20.39}
      INTERNAL_CLUSTER_SECRET: lan_guessr_cluster_secret_e9f3b8a1
      LOBBY_SERVICE_URL: http://172.28.0.11:5001
      GAME_ENGINE_URL: http://172.28.0.12:5002
      ROAD_PROXY_URL: http://172.28.0.13:5003
    depends_on:
      - lobby-service
      - game-engine
      - road-proxy
    restart: unless-stopped

  # Lobby & Presence Lifecycle Microservice (NestJS)
  # Internal IP: 172.28.0.11 (Port 5001)
  lobby-service:
    build:
      context: ./backend/lobby-service
      dockerfile: Dockerfile
    container_name: lan-guessr-lobby
    networks:
      languessr_net:
        ipv4_address: 172.28.0.11
    expose:
      - "5001"
    environment:
      PORT: 5001
      REDIS_HOST: 172.28.0.15
      REDIS_PORT: 6379
      INTERNAL_CLUSTER_SECRET: lan_guessr_cluster_secret_e9f3b8a1
    depends_on:
      redis-bus:
        condition: service_healthy
    restart: unless-stopped

  # Core Game Engine & Real-Time Socket.IO Microservice (NestJS)
  # Internal IP: 172.28.0.12 (Port 5002)
  game-engine:
    build:
      context: ./backend/game-engine
      dockerfile: Dockerfile
    container_name: lan-guessr-engine
    networks:
      languessr_net:
        ipv4_address: 172.28.0.12
    expose:
      - "5002"
    environment:
      PORT: 5002
      DATABASE_URL: postgres://geoguessr:geopassword@172.28.0.14:5432/geodb
      REDIS_HOST: 172.28.0.15
      REDIS_PORT: 6379
      INTERNAL_CLUSTER_SECRET: lan_guessr_cluster_secret_e9f3b8a1
    depends_on:
      geo-db:
        condition: service_healthy
      redis-bus:
        condition: service_healthy
    restart: unless-stopped

  # Centralized Road & Panorama Image Fetcher / Cache Microservice (NestJS)
  # Internal IP: 172.28.0.13 (Port 5003)
  road-proxy:
    build:
      context: ./backend/road-proxy
      dockerfile: Dockerfile
    container_name: lan-guessr-road
    networks:
      languessr_net:
        ipv4_address: 172.28.0.13
    expose:
      - "5003"
    environment:
      PORT: 5003
      REDIS_HOST: 172.28.0.15
      REDIS_PORT: 6379
      INTERNAL_CLUSTER_SECRET: lan_guessr_cluster_secret_e9f3b8a1
    depends_on:
      redis-bus:
        condition: service_healthy
    restart: unless-stopped

  # High-Performance Geographical Database (PostgreSQL 16 + PostGIS)
  # Internal IP: 172.28.0.14
  geo-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: lan-guessr-geo-db
    networks:
      languessr_net:
        ipv4_address: 172.28.0.14
    environment:
      POSTGRES_DB: geodb
      POSTGRES_USER: geoguessr
      POSTGRES_PASSWORD: geopassword
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-geo-db.sql:/docker-entrypoint-initdb.d/init-geo-db.sql:ro
      - geo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoguessr -d geodb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 7 In-Memory Backbone & Real-time Pub/Sub Broker
  # Internal IP: 172.28.0.15
  redis-bus:
    image: redis:7-alpine
    container_name: lan-guessr-redis
    networks:
      languessr_net:
        ipv4_address: 172.28.0.15
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  languessr_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  geo-db-data:
