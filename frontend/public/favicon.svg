<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="16" fill="#0b1120"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Graduation Cap (Internship) -->
  <polygon points="32,13 11,23 32,33 53,23" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <path d="M19 28v10c0 3.8 5.8 7 13 7s13-3.2 13-7V28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Tassel -->
  <path d="M49 25v10c0 1.5-1 2.5-2.5 2.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46.5" cy="39" r="2" fill="#f59e0b"/>

  <!-- Search / Research Lens (Researcher) -->
  <circle cx="37" cy="40" r="9" fill="#0b1120" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <line x1="43.5" y1="46.5" x2="52" y2="55" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Core Research Sparkle -->
  <path d="M37 36v8M33 40h8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
